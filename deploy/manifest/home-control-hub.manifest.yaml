# Manifest (manifeststandaard v1, platformcontract 1.2 §9; eigenaar van de standaard: appstore-en-fork).
# Installatie uitsluitend als standaard TrueNAS Custom App (één image + formulierwaarden); een 'compose'-veld is
# verboden. De digest van de eigen GHCR-image vult de release-CI in (release/digests.json); zonder digest is installeren
# niet gereed. Poorten staan alleen in network.ports (contract 1.2: custom_app.ports en joins_platform_network zijn
# vervallen; apps delen nooit een Docker-netwerk).
# Koppelen met de Hub: bij installatie via de API geeft de Hub zelf HUB_URL, HUB_ENROLLMENT_TOKEN (eenmalig, 60 min)
# en HUB_KEY_FINGERPRINT mee (contract 1.2 §3.2, §8); het zijn daarom geen manifestparameters en custom_app.env blijft
# leeg. Gecontroleerd met de validator van appstore-en-fork (jl-manifest validate): geldig, 0 fouten; alleen de
# verwachte waarschuwing digest_pending_release (de digest komt pas bij een release).
manifest_version: "1"
app_id: home-control-hub
name: Home Control Hub
owner_repo: lvos04/home-control-hub
category: platform
description_nl: >-
  Integratiedienst: netwerk/privacy (NetAlertX, AdGuard Home, Tailscale, Cloudflared), Node-RED-automatisering,
  Authentik/SSO met beheerherstel (register en adviseur; de noodlogin zelf zit in de Hub) en energie/resources.
  API-dienst met alleen een kleine Nederlandse statuspagina; alle schermen staan in de Hub-UI van ai-server-manager.
version: "0.1.0"
install:
  method: custom_app
image:
  repository: ghcr.io/lvos04/home-control-hub
  tag: "0.1.0"
  digest: null  # wordt door release.yml ingevuld (release/digests.json); nooit installeren zonder digest
custom_app:
  storage:
    - name: appdata
      type: host_path
      host_path: {param: appdata_path}
  env: []  # geen verplichte variabelen; HUB_* zet de Hub zelf bij app.install/app.update (zie boven)
  resources:
    cpus: 1
    memory_mib: 512
  gpu: none
  run_as:
    mode: image_default  # start als root alleen voor /appdata, daarna alles (ook PID 1) als 568 zonder capabilities
  timezone: {param: timezone}
  restart_policy: unless-stopped
  portal:
    port: web
    scheme: http
    path: /
    name: Statuspagina
parameters:
  - name: host_port
    type: port
    source: default
    default: 30420
    required: true
    description_nl: Hostpoort; voorstel uit het platformcontract, de Hub controleert vóór installatie op conflicten.
  - name: appdata_path
    type: path
    source: dataset_picker
    dataset_role: home_control_hub_appdata
    decision: D02
    required: true
    description_nl: Dataset voor /appdata (ingebouwde database, geheimen, koppelstatus en back-ups), via de datasetkiezer.
  - name: timezone
    type: timezone
    source: wizard
    required: true
    description_nl: Tijdzone van de NAS, gemeten of bevestigd in de onboarding-wizard.
  - name: rpo
    type: duration
    source: wizard
    decision: D16
    required: false
    description_nl: Maximaal toegestaan dataverlies (RPO), vastgelegd in de wizard (D16).
  - name: rto
    type: duration
    source: wizard
    decision: D16
    required: false
    description_nl: Maximaal toegestane hersteltijd (RTO), vastgelegd in de wizard (D16).
storage:
  - name: appdata
    mount: /appdata
    kind: data
    required_dataset_role: home_control_hub_appdata
    description_nl: Database (PostgreSQL 16), /appdata/secrets (incl. hub-link.json) en /appdata/backups.
network:
  ports:
    - name: web
      container_port: 30420
      host_port: {param: host_port}
      protocol: tcp
      purpose_nl: API, connectorcontract en statuspagina
  host_network: false
  host_network_reason: null
privileges:
  privileged: false
  cap_add: []
  devices: []
  gpu: none
privilege_reason: null
healthcheck:
  type: http
  path: /readyz
  port: web
  interval_s: 30
  timeout_s: 8
  start_period_s: 90
  retries: 3
backup:
  db_export:
    method: pg_dump
    description_nl: Automatische pg_dump vóór elke databasemigratie in /appdata/backups (nieuwste 3 blijven).
  snapshot_datasets: [appdata]
  rpo: {param: rpo}
  rto: {param: rto}
dependencies:
  - app_id: ai-server-manager
    kind: optional
    reason_nl: Koppelen (enrollment) en gebruikers via de Hub; zonder Hub draait de dienst en toont eerlijk 'nooit gekoppeld'.
  - app_id: authentik
    kind: optional
    reason_nl: >-
      B13-002…005 lezen Authentik (officiële TrueNAS-catalogusapp, 'Mount Docker Socket' uit); zonder Authentik werken
      B13-001 en de rest en tonen B13-002…005 'niet ingesteld'.
sso: none
risk:
  install: R2
  update: R2
  uninstall: R2
upgrade:
  migrations: true
  tag_only_rollback_safe: false
  notes_nl: >-
    Alembic-migraties bij de start (0001 basisschema, 0002 B13 P1, 0003 replaycache contract 1.2), met een pg_dump
    vooraf. Terug naar een oudere tag kan pas nadat de back-up of dataset-snapshot van vóór de update is hersteld.
    De koppeling met de Hub staat in /appdata/secrets/hub-link.json en wordt bij de eerste start van 1.2 eenmalig uit
    de database overgezet.
decisions_required: [D01, D02, D03, D16, D17]
docs: [B10, B11, B13, B14, I09, I10, I11, I12, I21]
validation_status: unvalidated
compatibility:
  # bron: appstore-en-fork docs/TRUENAS_APP_VALUES.md (ix-app 1.4.8 vraagt min_scale_version 24.10.2.2);
  # NIET GEVALIDEERD op een echte NAS
  truenas_min_version: "24.10.2.2"
  truenas_max_version: null
  ix_app_min_version: "1.2.0"
provenance:
  source_repo: https://github.com/lvos04/home-control-hub
  source_commit: null
  upstream_repo: null
  license: GPL-3.0
