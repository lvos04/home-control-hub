# ALLEEN VOOR ONTWIKKELING EN CI — dit is GEEN installatiemethode.
# Installeren op TrueNAS gebeurt uitsluitend als standaard Custom App (deploy/truenas/CUSTOM_APP.md).
#
#   docker compose -f deploy/dev/compose.yaml up --build
#   → statuspagina op http://127.0.0.1:30420
name: hch-dev
services:
  home-control-hub:
    build:
      context: ../..
      dockerfile: deploy/allinone/Dockerfile
    image: home-control-hub:dev
    ports:
      - "127.0.0.1:30420:30420"
    volumes:
      - hch-appdata:/appdata
    environment:
      # optioneel voor lokaal testen met een Hub; standaard leeg = eerlijk 'nooit gekoppeld'
      HUB_URL: ${HUB_URL:-}
      HUB_ENROLLMENT_TOKEN: ${HUB_ENROLLMENT_TOKEN:-}
      HUB_KEY_FINGERPRINT: ${HUB_KEY_FINGERPRINT:-}
    # Bewust geen security_opt/cap_drop: zo start het standaard TrueNAS Custom App-formulier de container ook
    # (contract 1.2 §2.2). De image wisselt zelf naar 568 zonder capabilities en zet no-new-privileges.
volumes:
  hch-appdata:
