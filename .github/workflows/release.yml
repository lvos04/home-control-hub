# Release: tag vX.Y.Z → alles-in-één image naar GHCR (exacte versie, nooit 'latest'), SBOM en
# release/digests.json met de digest (voor het manifest). Acties op commit-SHA gepind.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versie controleren
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME past niet bij VERSION $(cat VERSION)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bouwen en pushen
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/home-control-hub:${{ steps.v.outputs.version }}
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/home-control-hub:${{ steps.v.outputs.version }}
          format: spdx-json
          output-file: release/sbom.spdx.json
      - name: Digest vastleggen
        run: |
          mkdir -p release
          cat > release/digests.json <<JSON
          {"app_id": "home-control-hub", "version": "${{ steps.v.outputs.version }}",
           "image": "ghcr.io/${{ github.repository_owner }}/home-control-hub",
           "tag": "${{ steps.v.outputs.version }}", "digest": "${{ steps.push.outputs.digest }}"}
          JSON
          cat release/digests.json
      - name: Releasebestanden toevoegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "home-control-hub $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md release/digests.json release/sbom.spdx.json || \
          gh release upload "$GITHUB_REF_NAME" release/digests.json release/sbom.spdx.json --clobber
