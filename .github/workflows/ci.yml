# CI: lint, typen, tests met PostgreSQL, migraties op/neer, OpenAPI-drift, Peil-drift, pip-audit, dienst-E2E, de
# statuspagina in Peil in Chromium (axe-core, overloop, CSP, schermafdrukken) en de alles-in-één image bouwen + starten
# met healthcheck. Acties op commit-SHA gepind.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HCH_TEST_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Installeren
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check -e 'apps/api[dev]'
      - name: Ruff (lint + opmaak)
        run: |
          (cd apps/api && ruff check . && ruff format --check .)
          ruff check tests/e2e tests/interop tests/ui deploy/allinone tools && ruff format --check tests/e2e tests/interop tests/ui deploy/allinone tools
      - name: Mypy
        working-directory: apps/api
        run: mypy
      - name: Unit- en integratietests
        working-directory: apps/api
        run: pytest -q
      - name: Migraties op en neer
        env:
          HCH_DATA_DIR: ${{ runner.temp }}/hch-mig
          HCH_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/hch_ci_mig
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE hch_ci_mig'
          python -m integrations migrate
          python -m integrations migrate --down base
          python -m integrations migrate
      - name: OpenAPI-drift
        run: |
          python -m integrations openapi --out docs/openapi/home-control-hub.openapi.json
          git diff --exit-code docs/openapi/
      - name: Peil-drift (versie-gepinde kopie van het statuspaginasjabloon tegen ai-server-manager, O-14)
        run: |
          python tools/peil_kopie.py controleer
          python tools/peil_kopie.py vergelijk --online
      - name: Dienst-E2E (simulator)
        run: pytest -q tests/e2e -p no:cacheprovider
      - name: pip-audit (runtime-afhankelijkheden)
        run: pip-audit -r apps/api/requirements.lock --progress-spinner off

  statuspagina-ui:
    # statuspagina in Peil (HC11; ONTWERPTAAL §12/§13.2): de echte app rendert elke toestand tegen de Hub-simulator
    # (PostgreSQL); Chromium toetst axe-core = 0, geen overloop op 320–1440 px, CSP zonder JS, doelen ≥ 44 px,
    # tekst ≥ 14 px, focusring, eerste signaal nooit groen als niet gereed; schermafdrukken als artefact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HCH_TEST_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Installeren (Python-lock, npm ci met lockfile, Chromium)
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check -e 'apps/api[dev]'
          cd tests/ui && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Toestanden uit de echte app (niet gekoppeld, koppelen mislukt, gekoppeld, ingetrokken, niet gereed, …)
        run: python tests/ui/genereer_toestanden.py --uit tests/ui/uit
      - name: Playwright (axe-core, overloop, CSP, toetsenbord) + schermafdrukken
        working-directory: tests/ui
        env:
          SCHERMAFDRUKKEN: "1"
        run: npx playwright test
      - name: Schermafdrukken en toestanden bewaren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statuspagina-peil
          path: |
            docs/screenshots/peil/statuspagina/*.png
            tests/ui/uit/
          retention-days: 14

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Alles-in-één image bouwen
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          load: true
          tags: home-control-hub:ci
          build-args: VERSION=${{ github.sha }}
      - name: Starten, healthcheck en rooktest
        run: deploy/allinone/smoke-test.sh home-control-hub:ci
