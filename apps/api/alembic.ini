# Alleen voor ontwikkelaars ('alembic -c apps/api/alembic.ini …'); de app zelf gebruikt 'python -m integrations migrate'.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
